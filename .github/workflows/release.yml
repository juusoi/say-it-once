name: Release

on:
  push:
    branches: [main]

  # Rolling back without touching the server. Dispatch this with an older
  # commit and it rebuilds that code and moves :latest onto it; auto-update
  # picks it up on the next tick. Nothing on the box changes, so the floating
  # tag stays floating -- see "Rolling back" in deploy/README.md.
  #
  # The target is an input rather than the dispatch ref because the dispatch
  # API's own `ref` accepts only a branch or tag name, and dispatching *at* a
  # ref also needs this file to exist on it. Both limitations bite exactly
  # when you are in a hurry. Dispatch from main and pass the commit here.
  #
  # A dispatched rollback is TEMPORARY: main still holds the bad commit, so
  # the next merge republishes it. It buys time; `git revert` is the fix.
  workflow_dispatch:
    inputs:
      ref:
        description: Commit SHA or ref to build and publish as :latest
        type: string
        required: false
        default: ''

permissions:
  contents: read

# One publish at a time, queued rather than cancelled, so two overlapping runs
# cannot leave :latest pointing at the wrong build.
#
# Queueing has a consequence worth knowing before you dispatch a rollback: a
# push-triggered release already in the queue will run *after* yours and
# republish the commit you were rolling away from. Check the Actions queue is
# empty first.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Depend on CI rather than running alongside it, so a broken commit cannot
  # publish an image that the server would then pull within five minutes.
  ci:
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ inputs.ref || '' }}

  image:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      # Pinned to commit SHAs, not tags -- see the note in ci.yml.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || '' }}
          persist-credentials: false

      # github.sha is the ref the workflow was dispatched *from*, which on a
      # rollback is main rather than the commit being built. Resolve what was
      # actually checked out, so the sha- tag never names the wrong code.
      - id: built
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # The server is amd64. arm64 is built so the exact image that ships can
      # be pulled and smoke-tested on an Apple Silicon Mac.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Containerfile
          platforms: linux/amd64,linux/arm64
          push: true
          # Provenance attestations add extra manifests to the image index.
          # podman auto-update has no use for them and some versions handle
          # the resulting index poorly; keep it to the two platforms.
          provenance: false
          # :latest is the moving tag `AutoUpdate=registry` follows, so it has
          # to exist and has to move. Never put the sha- tag in a Quadlet
          # unit: it always resolves to the same digest, so auto-update has
          # nothing to notice. It is for identifying a build, not deploying
          # one -- deploy/preflight.sh fails if it ends up in the unit.
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:sha-${{ steps.built.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The digest is what the server compares against, so print it: it is the
      # one value that tells you whether a deploy actually landed.
      - name: Summary
        # Values come through env rather than being interpolated into the
        # script. DISPATCH_REF is supplied by whoever dispatches the workflow,
        # and `${{ }}` inside `run:` is textual substitution, so interpolating
        # it directly would be a script-injection seam.
        env:
          REPO: ${{ github.repository }}
          BUILT_SHA: ${{ steps.built.outputs.sha }}
          DIGEST: ${{ steps.build.outputs.digest }}
          DISPATCH_REF: ${{ inputs.ref }}
        run: |
          {
            echo "Published \`ghcr.io/$REPO\`"
            echo
            echo "- built from: \`$BUILT_SHA\`"
            echo "- tags: \`latest\`, \`sha-$BUILT_SHA\`"
            echo "- digest: \`$DIGEST\`"
            echo
            echo "The server picks this up within ~5 minutes via"
            echo "\`podman-auto-update.timer\`. See \`deploy/README.md\`."
            if [ -n "$DISPATCH_REF" ]; then
              echo
              echo "> Republished from a dispatch, so this is a **temporary**"
              echo "> rollback: \`main\` is unchanged and the next merge to it"
              echo "> will publish over this. Use \`git revert\` to make it stick."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
