name: CI

on:
  pull_request:
  # Called by release.yml, so an image can never be published ahead of the
  # tests that vet it. Two independent workflows would race.
  #
  # Deliberately no `push` trigger. release.yml runs on every push to main and
  # gates on this workflow with `needs:`, so a push trigger here would run the
  # whole job twice for one merge -- two lint runs, two test runs, two image
  # builds. Coverage is unchanged: pull requests hit `pull_request`, and main
  # is covered through release.yml.
  workflow_call:
    inputs:
      ref:
        description: Ref or SHA to check out. Empty means the triggering ref.
        type: string
        required: false
        default: ''

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to commit SHAs rather than tags: a tag is mutable,
      # so `@v7` silently follows whatever the tag points at today. The
      # trailing comment is the human-readable version, and is what Dependabot
      # reads to propose updates -- see .github/dependabot.yml.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Empty on `pull_request`, where checkout keeps its default
          # behaviour. Set only when release.yml is republishing an older
          # commit, so the tests vet the code actually being published rather
          # than whatever main happens to hold.
          ref: ${{ inputs.ref }}
          # Nothing here pushes with git, so do not leave a usable token
          # behind in the checkout for later steps to pick up.
          persist-credentials: false

      # Matches the Node used in development, so `node --test` behaves
      # identically locally and here.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      # Cheap backstop: catches a parse error even if the linter below is
      # ever misconfigured or skipped.
      - name: Syntax-check every script
        run: |
          node --check js/matching.js
          node --check js/categories.js
          node --check js/game.js

      # Biome is a single pinned binary, so linting costs no package.json, no
      # lockfile and no node_modules -- the repo still has zero dependencies.
      # Lint only; see biome.jsonc for why the formatter is off and why three
      # rules are disabled.
      - uses: biomejs/setup-biome@4c91541eaada48f67d7dbd7833600ce162b68f51 # v2.7.1
        with:
          version: 2.5.13

      - name: Lint JS and CSS
        run: biome ci --error-on-warnings .

      # actionlint shellchecks `run:` blocks but not standalone scripts, and
      # Biome does not cover shell at all -- so deploy/preflight.sh would
      # otherwise be the one unlinted file in the repo. A preflight script
      # with a bug in it is worse than no preflight script.
      #
      # Pinned by image digest. v0.11.0 matches the shellcheck used locally.
      - name: Lint shell scripts
        uses: docker://koalaman/shellcheck@sha256:61862eba1fcf09a484ebcc6feea46f1782532571a34ed51fedf90dd25f925a8d
        with:
          args: deploy/preflight.sh

      # Lints the workflow files themselves and shellchecks every embedded
      # `run:` script. Earns its place: it is what caught a `grep -q ... &&
      # exit 1` in this file that would have failed the build on its own
      # success path, because under bash -e a grep finding nothing returns 1.
      #
      # Pinned by image digest rather than the mutable :1.7.12 tag.
      - name: Lint workflows
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667

      # Note the glob: `node --test test/` fails on current Node, which
      # resolves the directory as a module. Passing files works.
      - name: Unit tests and category data validation
        run: node --test test/*.test.js

      # Also runs `caddy validate` inside the build, so a Caddyfile syntax
      # error fails here rather than on the server. Worth doing on pull
      # requests, where release.yml does not run.
      - name: Build the image
        run: docker build -f Containerfile -t say-it-once:ci .

      - name: Serve it and check the files and headers
        run: |
          docker run -d --name ci -p 8080:8080 say-it-once:ci

          for _ in $(seq 1 20); do
            if curl -fsS -o /dev/null http://127.0.0.1:8080/; then break; fi
            sleep 1
          done

          for f in / /css/styles.css /js/matching.js /js/categories.js /js/game.js; do
            echo "checking $f"
            curl -fsS -o /dev/null "http://127.0.0.1:8080$f"
          done

          headers=$(curl -fsS -D- -o /dev/null http://127.0.0.1:8080/)
          echo "$headers"

          if ! printf '%s' "$headers" | grep -qi 'content-security-policy'; then
            echo "CSP header is missing"; exit 1
          fi
          # Written as an if rather than `grep && { exit 1; }`: under bash -e a
          # grep that finds nothing returns 1 and would fail the step on the
          # success path, which is exactly the case this check is here for.
          if printf '%s' "$headers" | grep -qi '^server:'; then
            echo "Server header should be suppressed"; exit 1
          fi

          docker logs ci
